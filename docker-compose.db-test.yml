# Local-only database services for storage adapter integration tests.
services:
  postgres:
    image: postgres:17-alpine
    container_name: lalmax-test-postgres
    environment:
      POSTGRES_DB: lalmax_test
      POSTGRES_USER: lalmax
      POSTGRES_PASSWORD: ${LALMAX_TEST_POSTGRES_PASSWORD:-lalmax_test_only}
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lalmax -d lalmax_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  mysql:
    image: mysql:8.4
    container_name: lalmax-test-mysql
    environment:
      MYSQL_DATABASE: lalmax_test
      MYSQL_USER: lalmax
      MYSQL_PASSWORD: ${LALMAX_TEST_MYSQL_PASSWORD:-lalmax_test_only}
      MYSQL_ROOT_PASSWORD: ${LALMAX_TEST_MYSQL_ROOT_PASSWORD:-root_test_only}
    ports:
      - "127.0.0.1:53306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 5s
      retries: 40
