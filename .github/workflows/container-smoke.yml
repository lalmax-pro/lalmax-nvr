name: Released container smoke

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to verify
        required: true
        default: V1.0.2
        type: string

permissions:
  contents: read
  packages: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64, linux/arm/v7]
    steps:
      - name: Validate release and image reference
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[vV][0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Expected a v/V semantic release tag"
            exit 1
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${RELEASE_TAG#[vV]}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3

      - name: Report package visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api "orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${GITHUB_REPOSITORY#*/}" --jq .visibility

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the published binary and FFmpeg
        env:
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          docker pull --platform "$PLATFORM" "$IMAGE"
          actual=$(docker run --rm --platform "$PLATFORM" --entrypoint /usr/local/bin/lalmax-nvr "$IMAGE" --version)
          echo "$actual"
          test "$actual" = "lalmax-nvr version $RELEASE_TAG"
          docker run --rm --platform "$PLATFORM" --entrypoint ffmpeg "$IMAGE" -version

      - name: Verify anonymous pull
        env:
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          anonymous_config=$(mktemp -d)
          trap 'rm -rf "$anonymous_config"' EXIT
          docker --config "$anonymous_config" pull --platform "$PLATFORM" "$IMAGE"
