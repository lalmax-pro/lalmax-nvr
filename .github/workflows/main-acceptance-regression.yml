name: OpenClaw main acceptance regressions

on:
  pull_request:
    paths:
      - 'internal/camera/**'
      - 'internal/dlna/**'
      - 'internal/onvif/**'
      - '.github/workflows/main-acceptance-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-go-regressions:
    name: Ubuntu Go regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.2.0
        with:
          go-version-file: go.mod
      - name: Vet affected packages
        run: go vet ./internal/camera ./internal/dlna ./internal/onvif
      - name: Repeat focused race tests under load
        run: |
          CGO_ENABLED=1 go test -race -count=10 -timeout=4m \
            ./internal/camera ./internal/dlna ./internal/onvif \
            -run '^(TestStartCamera_|TestDLNAMediaStreaming$|TestONVIFDiscoveryHelpers$)'
      - name: Full non-race suite (default package concurrency)
        run: CGO_ENABLED=1 go test -count=1 -timeout=15m ./...
