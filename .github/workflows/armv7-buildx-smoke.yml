name: ARMv7 Buildx smoke (no publish)

on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build.yml
      - .github/workflows/armv7-buildx-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: armv7-buildx-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  armv7-build:
    name: ARMv7 Dockerfile build (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up QEMU for isolated ARMv7 smoke
        uses: docker/setup-qemu-action@v3.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3.8.0

      # Run the real multi-stage Dockerfile for linux/arm/v7. Keep both the
      # frontend and backend builders on BUILDPLATFORM; only the final target
      # architecture is arm/v7. Never push or publish from a pull request.
      - name: Build target ARMv7 image without publishing
        uses: docker/build-push-action@v6.12.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm/v7
          push: false
          load: false
          build-args: |
            VERSION=ci-armv7
          cache-from: type=gha
          cache-to: type=gha,mode=min
