name: Build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
      - 'V*'
  release:
    types: [published]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  # Never interrupt a tag build while release assets/images are being published.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Tests on pull requests need only read access. Release/publish jobs receive
# elevated permissions at the job level on tag pushes.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  container-smoke:
    needs: docker
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/container-smoke.yml
    with:
      release_tag: ${{ github.ref_name }}

  plan:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
    steps:
      - name: Skip a published event already built by its tag push
        id: plan
        uses: actions/github-script@v7
        with:
          script: |
            let build = true;
            if (context.eventName === 'release') {
              const { owner, repo } = context.repo;
              const tag = context.ref.replace('refs/tags/', '');
              const { data: runs } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: 'build.yml', event: 'push',
                head_sha: context.sha, status: 'completed', per_page: 100
              });
              const built = runs.workflow_runs.some(run =>
                run.head_branch === tag && run.head_sha === context.sha && run.conclusion === 'success');
              const { data: release } = await github.rest.repos.getRelease({
                owner, repo, release_id: context.payload.release.id
              });
              const expected = [
                'lalmax_nvr.zip',
                'lalmax-nvr-linux-amd64.tar.gz', 'lalmax-nvr-linux-arm64.tar.gz',
                'lalmax-nvr-linux-armv7.tar.gz', 'lalmax-nvr-windows-amd64.zip',
                'lalmax-nvr-darwin-amd64.tar.gz', 'lalmax-nvr-darwin-arm64.tar.gz'
              ];
              const complete = expected.every(name => release.assets.some(asset =>
                asset.name === name && asset.size > 0 && asset.state === 'uploaded'));
              build = !(built && complete);
              if (!build) core.info('This tag push already passed and published every expected asset.');
            }
            core.setOutput('build', String(build));

  home-assistant:
    needs: plan
    if: needs.plan.outputs.build == 'true' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V'))
    uses: ./.github/workflows/home-assistant.yml

  test:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[vV][0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Release tag must be v/V followed by a semantic version"
            exit 1
          fi

      - uses: actions/setup-go@v5.2.0
        with:
          go-version: '1.26.2'

      - name: Cache Go modules
        uses: actions/cache@v4.2.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Lint
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Test embedded lalmax RTC, server and VoIP
        run: |
          cd third/lalmax
          go test -race -count=1 ./logic ./rtc ./server ./voip/...

      - name: Display coverage
        run: go tool cover -func=coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          use_oidc: true
          files: coverage.out
          disable_search: true
          flags: go
          name: go-unit
          fail_ci_if_error: true

      - name: Check coverage threshold
        run: |
          echo "Checking coverage threshold..."
          total=$(go tool cover -func=coverage.out | grep 'total:' | awk '{print $3}' | sed 's/%//' )
          echo "Total coverage: $total%"
          if (( $(echo "$total < 35" | bc -l) )); then
            echo "Coverage $total% is below threshold of 35%"
            exit 1
          fi
          echo "Coverage threshold check passed"

  build-frontend:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: |
          cd web
          npm ci
          npm exec vitest run src/__tests__/flv-playback.test.ts
          npm run build
          cp -r dist/* ../internal/ui/static/

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: internal/ui/static/

  build-binaries:
    runs-on: ubuntu-latest
    needs: build-frontend
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: linux
            goarch: arm
            goarm: 7
            suffix: linux-armv7
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.2.0
        with:
          go-version: '1.26.2'

      - name: Cache Go modules
        uses: actions/cache@v4.2.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download frontend artifact
        uses: actions/download-artifact@v4.2.0
        with:
          name: frontend
          path: internal/ui/static/

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags="-s -w \
            -X main.appVersion=${{ github.ref_name }} \
            -X main.commitHash=${GITHUB_SHA::7} \
            -X main.buildTime=$(date -u +%Y%m%d%H%M%S)" \
            -o lalmax-nvr-${{ matrix.suffix }}${{ matrix.ext }} \
            ./cmd/lalmax-nvr/

      - name: Package release (unix)
        if: matrix.goos != 'windows'
        run: |
          mkdir -p lalmax-nvr-${{ matrix.suffix }}-release
          cp lalmax-nvr-${{ matrix.suffix }} lalmax-nvr-${{ matrix.suffix }}-release/
          cp config/config.example.yaml lalmax-nvr-${{ matrix.suffix }}-release/
          cp README.md README.zh.md LICENSE lalmax-nvr-${{ matrix.suffix }}-release/
          cp docs/QUICKSTART.md lalmax-nvr-${{ matrix.suffix }}-release/
          cp -r scripts/unix lalmax-nvr-${{ matrix.suffix }}-release/scripts
          tar czf lalmax-nvr-${{ matrix.suffix }}.tar.gz lalmax-nvr-${{ matrix.suffix }}-release

      - name: Package release (windows)
        if: matrix.goos == 'windows'
        run: |
          mkdir -p lalmax-nvr-${{ matrix.suffix }}-release
          cp lalmax-nvr-${{ matrix.suffix }}.exe lalmax-nvr-${{ matrix.suffix }}-release/
          cp config/config.example.yaml lalmax-nvr-${{ matrix.suffix }}-release/
          cp README.md README.zh.md LICENSE lalmax-nvr-${{ matrix.suffix }}-release/
          cp docs/QUICKSTART.md lalmax-nvr-${{ matrix.suffix }}-release/
          cp -r scripts/windows lalmax-nvr-${{ matrix.suffix }}-release/scripts
          zip -r lalmax-nvr-${{ matrix.suffix }}.zip lalmax-nvr-${{ matrix.suffix }}-release

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4.2.0
        with:
          name: lalmax-nvr-${{ matrix.suffix }}
          path: |
            lalmax-nvr-${{ matrix.suffix }}.tar.gz
            lalmax-nvr-${{ matrix.suffix }}.zip
            lalmax-nvr-${{ matrix.suffix }}${{ matrix.ext }}

  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [build-binaries, home-assistant]
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Download all artifacts
        uses: actions/download-artifact@v4.2.0
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          append_body: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            artifacts/lalmax-nvr-home-assistant/lalmax_nvr.zip
            artifacts/lalmax-nvr-linux-amd64/lalmax-nvr-linux-amd64.tar.gz
            artifacts/lalmax-nvr-linux-arm64/lalmax-nvr-linux-arm64.tar.gz
            artifacts/lalmax-nvr-linux-armv7/lalmax-nvr-linux-armv7.tar.gz
            artifacts/lalmax-nvr-windows-amd64/lalmax-nvr-windows-amd64.zip
            artifacts/lalmax-nvr-darwin-amd64/lalmax-nvr-darwin-amd64.tar.gz
            artifacts/lalmax-nvr-darwin-arm64/lalmax-nvr-darwin-arm64.tar.gz

  docker:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    needs: [build-binaries, home-assistant]
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Log in to Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          printf 'version=%s\n' "${RELEASE_TAG#[vV]}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5.6.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.8.0

      - name: Build and push Docker image
        uses: docker/build-push-action@v6.12.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
