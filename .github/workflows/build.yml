name: Build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Lint
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Display coverage
        run: go tool cover -func=coverage.out

      - name: Check coverage threshold
        run: |
          echo "Checking coverage threshold..."
          total=$(go tool cover -func=coverage.out | grep 'total:' | awk '{print $3}' | sed 's/%//' )
          echo "Total coverage: $total%"
          if (( $(echo "$total < 55" | bc -l) )); then
            echo "Coverage $total% is below threshold of 55%"
            exit 1
          fi
          echo "Coverage threshold check passed"

  build-frontend:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: |
          cd web
          npm ci
          npm run build
          cp -r dist/* ../internal/ui/static/

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: internal/ui/static/

  build-binaries:
    runs-on: ubuntu-latest
    needs: build-frontend
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: linux
            goarch: arm
            goarm: 7
            suffix: linux-armv7
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend
          path: internal/ui/static/

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags="-s -w \
            -X main.appVersion=${{ github.ref_name }} \
            -X main.commitHash=${GITHUB_SHA::7} \
            -X main.buildTime=$(date -u +%Y%m%d%H%M%S)" \
            -o lalmax-nvr-${{ matrix.suffix }}${{ matrix.ext }} \
            ./cmd/lalmax-nvr/

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: lalmax-nvr-${{ matrix.suffix }}
          path: lalmax-nvr-${{ matrix.suffix }}${{ matrix.ext }}

  release:
    runs-on: ubuntu-latest
    needs: build-binaries
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          append_body: true
          files: |
            artifacts/lalmax-nvr-linux-amd64/lalmax-nvr-linux-amd64
            artifacts/lalmax-nvr-linux-arm64/lalmax-nvr-linux-arm64
            artifacts/lalmax-nvr-linux-armv7/lalmax-nvr-linux-armv7
            artifacts/lalmax-nvr-windows-amd64/lalmax-nvr-windows-amd64.exe
            artifacts/lalmax-nvr-darwin-amd64/lalmax-nvr-darwin-amd64
            artifacts/lalmax-nvr-darwin-arm64/lalmax-nvr-darwin-arm64
