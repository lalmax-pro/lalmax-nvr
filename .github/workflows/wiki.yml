name: Publish GitHub Wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/zh/**/*.md"
      - "docs/wiki/**"
      - "scripts/build_wiki.py"
      - "scripts/check_docs.py"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout knowledge base sources
        uses: actions/checkout@v4.2.2

      - name: Check documentation links
        run: python3 scripts/check_docs.py

      - name: Build Wiki pages
        run: python3 scripts/build_wiki.py --output "$RUNNER_TEMP/wiki-generated"

      - name: Clone initialized Wiki repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" \
            "$RUNNER_TEMP/wiki-repository"

      - name: Publish generated pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp -R "$RUNNER_TEMP/wiki-generated/." "$RUNNER_TEMP/wiki-repository/"
          cd "$RUNNER_TEMP/wiki-repository"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi
          git commit -m "Sync knowledge base from ${GITHUB_SHA}"
          git push origin HEAD
