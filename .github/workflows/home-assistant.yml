name: Home Assistant integration
on:
  workflow_call:
  pull_request:
    paths: ['custom_components/**', 'tests/home_assistant/**', 'scripts/package_home_assistant.py', 'hacs.json', 'info.md', '.github/workflows/home-assistant.yml']
  push:
    branches: [main]
    paths: ['custom_components/**', 'tests/home_assistant/**', 'scripts/package_home_assistant.py', 'hacs.json', 'info.md', '.github/workflows/home-assistant.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r tests/home_assistant/requirements.txt
      - run: ruff check custom_components/lalmax_nvr tests/home_assistant
      - run: python -m pytest -q tests/home_assistant
      - run: python scripts/package_home_assistant.py
      - uses: actions/upload-artifact@v4
        with:
          name: lalmax-nvr-home-assistant
          path: dist/lalmax_nvr.zip
          if-no-files-found: error
