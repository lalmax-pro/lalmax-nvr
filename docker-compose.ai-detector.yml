# Docker Compose for AI Detector Service (Python + YOLO)
#
# Usage:
#   docker compose -f docker-compose.ai-detector.yml up -d
#
# This service:
#   - Connects to lalmax-nvr API to get camera list
#   - Subscribes to RTSP streams using OpenCV
#   - Runs YOLO inference on frames
#   - Sends detections to lalmax-nvr webhook
#
# Prerequisites:
#   - lalmax-nvr running on host (port 9090)
#   - RTSP stream available (port 15544)

services:
  ai-detector:
    build:
      context: ./docker/ai-detector
      dockerfile: Dockerfile
    environment:
      # NVR connection
      - NVR_URL=http://host.docker.internal:9090
      # NVR auth (base64 encoded "username:password")
      # Generate with: echo -n "admin:admin123" | base64
      - NVR_AUTH=YWRtaW46YWRtaW4xMjM=
      # YOLO configuration
      - YOLO_MODEL=yolov8n.pt
      - CONFIDENCE=0.5
      - NMS_THRESHOLD=0.4
      # Frame processing
      - FRAME_SKIP=5  # Process every 5th frame
      - SYNC_INTERVAL=30  # Sync camera list every 30 seconds
      - RTSP_PORT=15544  # lalmax RTSP port
      # Object tracking (supervision library)
      - ENABLE_TRACKING=true
      # Motion gating (frigate-style): only run inference on motion regions
      - MOTION_ONLY=true
      - MOTION_THRESHOLD=30  # Pixel difference threshold, 1-255 (higher = less sensitive)
      - MOTION_CONTOUR_AREA=10  # Min contour area at the downscaled motion resolution
      - MOTION_FRAME_HEIGHT=100  # Height frames are downscaled to for motion analysis
      - MOTION_LIGHTNING_THRESHOLD=0.8  # Recalibrate instead of reporting motion above this frame fraction
      - IMPROVE_CONTRAST=true
      # Region-based detection: motion boxes are clustered into square crops
      - REGION_MIN_SIZE=320  # Min region edge in pixels (small motion is upscaled for the model)
      - MAX_REGIONS=4  # Above this many regions, fall back to one full-frame pass
      # Stationary suppression: stop reporting objects that stay put
      - STATIONARY_THRESHOLD=50  # Processed frames with unchanged position before an object is stationary
      # Health check port
      - PORT=8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:8080"  # Health check port (mapped to 8081 to avoid conflict)
    restart: unless-stopped
    # GPU support (uncomment if available)
