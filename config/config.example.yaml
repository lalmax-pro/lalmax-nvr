# lalmax-nvr Configuration
# Copy to lalmax-nvr.yaml and customize for your setup
# Or use: ./lalmax-nvr init --password <your-password>
#
# All durations use Go duration format: 30s, 5m, 1h, 24h
# Camera IDs must be unique; IDs with special characters are encoded safely on disk.
# Enables, ports, and thresholds are validated on startup

# HTTP server listen address (default: ":9090")
server:
  listen: ":9090"

# Optional real-time transcoding (experimental; off by default).
# Restart after changing paths/listeners. Use Settings > Transcoding capabilities
# to check tools and each saved profile before enabling jobs. Embedded engine and
# an enabled RTMP listener are required; no listener is enabled automatically.
transcoding:
  enabled: false
  max_concurrent: 2
  threads_per_job: 2
  ffmpeg_path: ""       # Empty: resolve ffmpeg from PATH
  ffprobe_path: ""      # Used for media inspection, including GStreamer dimensions
  gst_launch_path: ""   # Empty: resolve gst-launch-1.0 from PATH
  gst_inspect_path: ""  # Empty: resolve gst-inspect-1.0 from PATH

# Storage settings
# root_dir: where recordings, database, and HLS segments are stored.
# Docker: set via NVR_DATA_DIR env var (default /data). See docker-compose.yml.
# Binary: set via --data-dir flag or directly in YAML.
storage:
  root_dir: "/var/lib/lalmax-nvr"   # Change to your preferred path (e.g. /mnt/external/nvr)
  segment_duration: "30s"          # MP4 segment target duration (1s-30m; rotates at keyframe)
  # Optional: start directly with PostgreSQL or MySQL. Leave both unset for SQLite.
  # database_driver: "postgres"     # postgres | mysql
  # database_dsn: "postgres://nvr:password@127.0.0.1:5432/lalmax_nvr?sslmode=disable"
  # database_dsn: "nvr:password@tcp(127.0.0.1:3306)/lalmax_nvr?parseTime=true"
  # database_migration_target:            # Test-only destination; does NOT change the active DB
  #   driver: "postgres"
  #   dsn: "postgres://nvr:replace-me@127.0.0.1:5432/new_nvr?sslmode=disable"

# lal/lalmax media engine configuration.
media:
  mode: "embedded"                         # embedded | http
  # Direct lalmax HTTP playback (WHEP/LL-HLS/fMP4) requires NVR login by default.
  # To allow anonymous browser playback on a TRUSTED LAN only, explicitly set:
  # http_play_auth_enabled: false
  # WARNING: With a publicly reachable lalmax port, anyone can access live streams.
  # NVR management, internal media controls and publish auth remain protected.
  # Configured auth.playback_tokens may still require stream-specific tokens.
  lalmax_http_addr: "http://127.0.0.1:12090"
  lalmax_public_url: "http://127.0.0.1:12090"  # Use a public hostname; otherwise RTSP URLs become 127.0.0.1
  # lalmax_config_path is auto-generated at {root_dir}/config/lalmax.conf.json
  # Uncomment to override: lalmax_config_path: "/custom/path/lalmax.conf.json"
  # Lal protocol ports used for playback URLs in mode=http.
  # In embedded mode, set RTMP ingest port under rtmp.port; RTSP and HTTP
  # listener ports use the embedded media engine defaults.
  # rtmp_port: 11935                      # External lal RTMP port (default: 11935)
  # rtsp_port: 15544                      # External lal RTSP port (default: 15544)
  # Native RTSP Basic/Digest auth is disabled by default.
  # rtsp_auth_enable: false
  # rtsp_auth_method: 1                  # 0=Basic (default), 1=Digest
  # rtsp_username: "viewer"              # Required only with rtsp_auth_enable: true
  # rtsp_password: "replace-with-private-secret" # Required only when auth is enabled
  # By default a configured auth.publish_tokens also applies to RTSP publishers.
  # For explicitly anonymous RTSP publishing (no native login and no shared
  # publish token), set BOTH rtsp_auth_enable: false and the following flag:
  # rtsp_publish_auth_enabled: false
  # When false, the NVR also turns off native RTSP auth in an existing
  # lalmax.conf.json, while retaining the ban checks. Use only on a trusted LAN.
  # Optional auth.playback_tokens can still protect RTSP/RTMP playback separately.
  # http_port: 18080                      # External lal HTTP-FLV/HLS-TS port (default: 18080)
  #
  # Protocol -> Port mapping:
  #   lalmax (port 12090): HLS (fMP4), LL-HLS, WebRTC, fMP4, WS-FLV
  #   lal (port 18080):   HLS (TS), HTTP-FLV
  #   lal (port 11935):   RTMP, when rtmp.enabled is true
  #   lal (port 15544):   RTSP  (rtsp://{lalmax_public_url host}:15544/live/{camera_id})

# DLNA MediaServer — publishes live streams and recordings to trusted LAN players.
# The LAN address is detected automatically. port is a dedicated listener,
# separate from server.listen.
# dlna:
#   enabled: false
#   friendly_name: "Lalmax NVR"
#   uuid: ""                            # Optional stable UPnP UUID; empty uses generated/default identity
#   port: 8200
#   advertise_url: ""                   # Optional reachable http://LAN-IP:8200/ URL, never loopback
#   allowed_cidrs: []                  # Restrict LAN clients, e.g. ["192.168.1.0/24"]
#   interface: ""                      # optional NIC name; empty uses the detected LAN address
#   include_live: true
#   include_recordings: true
#   gop_cache: 1                       # HTTP-TS GOP cache count, 1-16; 1 starts at the latest keyframe
#   max_browse_count: 200
#   max_media_viewers: 4              # reserved; currently not enforced

# Authentication
# Option 1: Set password_hash (generate with: lalmax-nvr hash-password <pw>)
# Option 2: Set password in plaintext (auto-converted to hash on first run)
auth:
  username: "admin"
  password_hash: ""  # Use `lalmax-nvr hash-password <password>` to generate
  # password: ""      # Or set plaintext here (auto-hashed on first start)
  # publish_tokens:    # Optional shared tokens for media publishing (including RTSP).
  #   front-door: "generate-a-long-random-token"
  # playback_tokens:   # Optional; when configured, media playback requires a token.
  #                    # Use ?token=<value> for RTMP/RTSP/HTTP-FLV/HTTP-TS/HLS/HTTP-fMP4/WebRTC URLs.
  #                    # For embedded HTTP playback, use HTTP Basic for NVR account auth
  #                    # when also passing this per-stream token.
  #                    # HLS playlists carry the token through to each segment.
  #                    # For SRT request mode, pass the value as u=<token> in streamid.
  #   front-door: "generate-a-different-long-random-token"

# Camera configuration — add your cameras here
# Each camera must have a unique ID and valid URL with scheme + host
# Supported protocols: rtsp, http, onvif, xiaomi
# Supported encodings: h264, h265, mjpeg, jpeg
# Cameras are managed via the Web UI and stored in {storage.root_dir}/lalmax-nvr.db.
# Do not list devices here — legacy entries are migrated to the database on startup.
cameras: []
# Example camera fields (for reference only — add devices through the Web UI):
# cameras:
#   - id: "front-door"
#     name: "Front Door"
#     protocol: "rtsp"        # Transport: rtsp, http, onvif, xiaomi
#     encoding: "h264"         # Encoding: h264, h265, mjpeg, jpeg
#     url: "rtsp://192.168.1.100:554/stream"
#     rtsp_transport: "tcp"             # tcp | udp; defaults to tcp
#     stream_id: ""                     # Optional lalmax group ID override
#     stream_encoding: ""               # Optional detected/overridden source stream encoding
#     sub_stream_url: ""                 # Optional preview RTSP URL
#     sub_profile_token: ""             # Optional ONVIF sub-stream profile
#     snapshot_url: ""                  # Optional HTTP snapshot endpoint
#     frame_watchdog_timeout: ""        # Optional duration for lost-frame detection
#     pull_retry_num: 0                 # Source-specific pull retries; tune per camera
#     enabled: true
#     audio_enabled: true           # Supported H.264/H.265 cameras default to audio on
#     adaptive:
#       timelapse_interval: "30s"   # Sparse-recording calm-state keyframe interval
#     timelapse:
#       enabled: false
#       interval: "30s"
#       output_fps: 25
#       video_codec: "h264"
#       delete_original: false
#   - id: "backyard"
#     name: "Back Yard"
#     protocol: "http"
#     encoding: "jpeg"
#     url: "http://192.168.1.101/capture"
#     enabled: true
#     audio_enabled: false          # Audio is not supported for HTTP-JPEG.
#   - id: "xiaomi-cam"
#     name: "Xiaomi Camera"
#     protocol: "xiaomi"
#     encoding: "h264"
#     did: "xiaomi_device_id"      # Xiaomi Device ID
#     vendor: "cs2"                # Transport vendor: "cs2" (default)
#     enabled: true
#     audio_enabled: true           # Supported H.264/H.265 cameras default to audio on

# Xiaomi cloud account settings (required for xiaomi cameras)
# xiaomi:
#   user_id: ""    # Populated after first login
#   token: ""      # Xiaomi passToken (obtained via /api/xiaomi/auth)
#   region: "cn"   # Region: cn, sg, de, etc.

# Cleanup — retention and disk threshold policies
# Cleanup runs on a schedule and removes old recordings
cleanup:
  retention_days: 30               # Delete recordings older than N days (1-3650)
  check_interval: "1h"             # How often to check for expired recordings
  disk_threshold_percent: 95       # Start cleanup when disk usage exceeds N% (50-99)

# Segment merging — combine short segments into longer recordings
# Only active when enabled: true. All duration fields are required when enabled.
merge:
  enabled: false                   # Enable segment merging
  check_interval: "1h"             # How often to check for merge candidates
  window_size: "1h"                # Time window for merging segments
  batch_limit: 200                 # Max segments to merge in one batch
  min_segment_age: "10m"           # Minimum age before a segment can be merged (periodic pass)
  min_segments_to_merge: 3         # Minimum segments required to trigger a periodic merge
  rolling_enabled: true            # Merge into the current hour bucket shortly after each segment closes
  rolling_debounce: "5s"           # Wait this long after the last closed segment before merging

# FTP server — plain FTP access to the storage root. Current authentication
# checks auth.password, while first-run setup clears it after hashing; see
# docs/en/ftp-integration.md before relying on FTP login.
# Configurable port and passive port range
ftp:
  enabled: true                    # Enable FTP server (default: true)
  port: 2121                       # FTP control port (1-65535)
  passive_port_range: "2122-2140"  # Passive mode port range

# MQTT trigger-based recording for smart home integration
# When enabled, subscribe to topic for recording triggers
mqtt:
  enabled: false                   # Enable MQTT client
  broker: "tcp://localhost:1883"   # MQTT broker URL
  topic: "lalmax-nvr"               # Prefix; NVR subscribes to {topic}/trigger/+
  client_id: "lalmax-nvr"           # MQTT client ID
  username: ""                     # MQTT broker authentication (optional)
  password: ""                     # MQTT broker password (optional, auto-encrypted if encryption key is set)

