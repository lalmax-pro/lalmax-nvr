# auto_discover:
#   enabled: false
#   listen_for_hello: true
#   scan_interval: 60s
#   default_username: ""
#   default_password: ""
#   network_interface: ""               # Optional NIC for ONVIF discovery

# Event / adaptive recording windows
# event:
#   post_roll: 30s
#   max_duration: 5m

# Health IP self-healing (default on)
# health:
#   enabled: false
#   events_retention: "720h"           # Retain health events for 30 days
