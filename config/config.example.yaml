#     max_idr_interval: "60s"
#   layer2_5:
#     freeze_timeout: "10s"
#   auto_remediation:
#     enabled: false
#     max_restarts_per_hour: 3
#     cooldown_minutes: 5
#     blacklist_hours: 1
#     global_max_per_min: 10
#     offline_restart_seconds: 90
#   rediscovery:
#     enabled: true
#     max_parallel: 16
#     probe_timeout: 2s

# Sub-stream preview idle stop (seconds, default 60)
# streaming:
#   default_protocol: "webrtc"           # webrtc | flv | ws-flv | hls | ll-hls
#   auto_stop_no_view_sec: 300           # Stop idle publisher after 5m; 0 currently defaults to 300
#   preview_auto_stop_sec: 60
#   webrtc:
#     enabled: true
#     max_viewers: 2
#     idle_timeout: "60s"
#   flv:
#     enabled: true
#     max_viewers: 10
#     idle_timeout: "60s"
#     gop_cache_size: 1
#
# WebSocket streaming (not the same as WHEP signaling)
# websocket:
#   max_viewers: 10
#   write_buf_size: 100
#   # idle_timeout is a Go time.Duration. When explicitly set in YAML,
#   # this field is parsed as integer nanoseconds (60s = 60000000000).
#   # idle_timeout: 60000000000
#
# IPTV is an independent module (Web UI: #/iptv). Import and validate M3U,
# play in the browser, or publish through NVR for protocol playback.
# Publication and recording plans share one server-side HLS pull.
# iptv:
#   max_concurrent_pulls: 32          # shared publication/recording pulls, range 1-128

# WebDAV server — file access over WebDAV protocol
# Shares recordings directory over HTTP
webdav:
  enabled: true                    # Enable WebDAV server (default: true)
  path_prefix: "/dav"              # URL path prefix for WebDAV access
  read_write: false                # Allow write operations (PUT, MKCOL, DELETE, etc.)

# RTMP ingest — receive pushed streams from cameras or encoders
# RTMP is served by the embedded media engine on port 11935 by default when enabled.
# RTMP publishing requires stream_key by default (publish_auth_enabled: true).
# Push URL: rtmp://<host>:11935/live/<stream_id>?stream_key=<token>
# To accept anonymous RTMP publishers on a TRUSTED LAN only:
#   publish_auth_enabled: false
# Anonymous RTMP still checks banned stream IDs. Exposing an anonymous RTMP
# port to the Internet allows unknown senders to publish or occupy stream IDs.
# Restrict TCP 11935 with host/cloud firewall rules before disabling auth.
# rtmp:
#   enabled: true
#   port: 11935
#   publish_auth_enabled: true  # default (omit for secure default)
#   stream_keys:
#     front-door: "generate-a-long-random-token"

# SRT ingest — receive MPEG-TS pushed streams from cameras or encoders
# SRT is served by lalmax on port 19000 (managed by the media engine).
# Camera streamid format: #!::h=<stream_id>,m=publish,u=<token>
# srt:
#   enabled: true
#   port: 19000                          # Embedded SRT UDP ingress; default 19000
#   stream_keys:
#     front-door: "generate-a-long-random-token"

# WHIP ingest — WebRTC-HTTP publish (OBS, WHIP clients)
# Signaling: http://<host>:12090/webrtc/whip?streamid=<camera_id>
# ICE mux: UDP/TCP 4888 (must be reachable from the publisher)
# WHEP playback is separate and stays on even if whip.enabled is false.
# whip:
#   enabled: true
#   stream_keys:
#     front-door: "my-whip-stream"
#   publish_tokens:
#     front-door: "generate-a-long-random-token"

# GB28181 SIP signaling — NVR is the SIP platform (上级), not an RTSP puller.
# Devices REGISTER inbound; after Catalog, the NVR sends INVITE and the device
# pushes PS/RTP to media_ip (国标推流). lalmax demuxes PS into the live group.
# gb28181:
#   enabled: true
#   port: 5060                          # SIP listen port (default: 5060)
#   id: "34020000002000000001"          # 20-digit platform SIP ID (required)
#   password: "replace-with-a-private-secret" # Required for device registration digest auth
#   media_ip: "192.168.1.100"           # IP for SDP media reception (required, your server's IP)
#   media_port: 0                       # 0=auto/multi-port; >0=single RTP receive port
#   host: ""                            # SIP listen host (optional, auto-detect from media_ip)
#   standard_version: "2016"             # GB28181 standard version: 2016 or 2022
#   whep_on_demand_enabled: false          # Opt-in: direct WHEP URL starts offline-media registered GB28181 channel via INVITE

# Experimental JT1078/JT808 support: simulated terminals only; no real-device validation.
# JT/T 808 signaling (disabled by default). Requires the embedded JT1078
# TCP/UDP receiver in lalmax and a media_ip reachable by the vehicle terminal.
# jt808:
#   enabled: true
#   port: 808
#   media_ip: "192.168.1.100"
#   auth_code: "set-a-private-jt808-secret"  # issued on registration, required for auth
#   media_tcp_port: 1078
#   media_udp_port: 1078
#   transport: tcp                  # tcp | udp
#   timeout: "3s"                   # command acknowledgement timeout
#   ftp_port: 2121                  # optional 0x9206 override; default is ftp.port
#   ftp_user: ""                    # optional; default is auth.username
#   ftp_password: ""                # optional plaintext; required if auth.password is empty

# HLS streaming — on-demand live view via Web Web UI
# RPi constraint: max 4 concurrent streams
hls:
  # enabled: false                      # HLS disabled by default to avoid unnecessary disk writes
  # on_demand: true                     # Slice only while a client requests HLS
  # idle_timeout: "60s"                 # Stop HLS slicing after the idle period
  # low_latency: true                   # ApplyDefaults currently forces this to true
  # part_min_duration: "200ms"          # LL-HLS part duration; 100ms..1s
  # lal_fragment_duration_ms: 3000      # MPEG-TS fragment duration
  # lal_fragment_num: 6                 # Live MPEG-TS playlist entries
  # lal_cleanup_mode: 2                 # Forced ASAP cleanup by ApplyDefaults
  # lal_use_memory: false               # Store TS segments in RAM instead of files
  # lal_temp_dir: "hls-temp"            # MPEG-TS storage temp directory
  # lalmax_segment_duration: 1          # fMP4 segment duration in seconds
  # lalmax_part_duration: 200           # LL-HLS partial duration in milliseconds
  write_buffer_size: 40            # Async frame buffer per stream (default: 100)
  segment_max_size_mb: 10          # HLS segment max size in MB (default: 10)
  segment_count: 7                 # Segments per stream (range: 3-10, default: 7)
  max_streams: 4                   # Max concurrent HLS streams (range: 1-20, default: 4)

# Observability — logging, API telemetry, and optional external OTLP/HTTP export
observability:
  log_level: "info"                # Log level: debug, info, warn, error (default: info)
  log_format: "text"               # Log format: json or text (default: text)
  trace_retention: "24h"           # Retain local searchable traces for this duration
  max_local_traces: 10000          # Maximum number of traces retained in the application database
  local_trace_enabled: true        # Store spans locally; can also be toggled in Web Settings
  trace_ui_url_template: ""        # Optional Jaeger/Tempo URL with {trace_id}, e.g. http://localhost:16686/trace/{trace_id}
  # enable_pprof: false            # Enable pprof debug endpoints (default: false)
  otlp:
    enabled: false                 # Export traces, metrics, and logs to an external collector
    endpoint: "http://127.0.0.1:4318" # OTLP/HTTP base URL; signal paths are appended
    service_name: "lalmax-nvr"
    traces_enabled: true
    metrics_enabled: true
    logs_enabled: true
    timeout: "10s"
    metrics_export_interval: "30s"
    logs_export_interval: "1s"
    # headers:                     # Optional collector authentication headers
    #   Authorization: "Bearer replace-me"

# Transcoding — optional video transcoding via FFmpeg
# Used to reduce bitrate, change codec format, or adjust quality
# Requires ffmpeg to be installed on the system
# transcoding:
#   enabled: false              # Enable transcoding (default: false)
#   ffmpeg_path: ""              # Path to ffmpeg binary (empty = auto-detect)
#   max_workers: 1               # Max concurrent transcoding jobs (range: 1-4, default: 1)
#   replace_original: false      # Replace original recordings with transcoded versions
#   download_url: ""             # Auto-populated FFmpeg download URL per platform
#
# Per-camera transcoding overrides:
#   cameras:
#     - id: "front-door"
#       ...
#       transcoding:
#         enabled: true           # Override global enabled for this camera
#         target_codec: "h264"    # Target codec: h264, h265 (default: same as source)
#         preset: "ultrafast"     # FFmpeg preset: ultrafast, faster, medium (default: ultrafast)
#         bitrate: "2M"           # Target bitrate (e.g. "1M", "2M", "500K")

# SIP inbound calls are published as voip_<caller>_<short-call-id> streams.
# Requires media.mode: embedded. SIP port 5070 avoids GB28181's 5060.
voip:
  enabled: false
  manual_answer: false       # true to ring in the Web UI and require an operator to answer
  ring_timeout_ms: 30000
  pbx_server: ""              # e.g. "pbx.example.com:5060"
  pbx_transport: udp           # udp | tcp | tls
  pbx_domain: ""              # optional SIP domain; defaults to the PBX server host
  pbx_tls_server_name: ""     # optional TLS certificate name override
  pbx_tls_ca_file: ""         # optional private CA PEM; empty uses system trust roots
  pbx_username: ""
  pbx_password: ""            # secret is retained when omitted from Web settings updates
  pbx_register_expires: 3600
  sip_listen_addr: "0.0.0.0:5070"
  sip_tcp_listen_addr: ""  # set to "0.0.0.0:5070" to enable TCP
  sip_ip: ""             # advertised IPv4; configure for remote clients
  media_ip: ""           # advertised RTP IPv4; sockets bind on all interfaces
  media_port_min: 41000
  media_port_max: 42000
  realm: "lalmax-nvr"
  auth_enable: false
  users: []              # [{username: "door", password: "change-me", record_calls: true}]，录制须启用 auth_enable
  rtp_timeout_ms: 15000
  ack_timeout_ms: 32000
  srtp_enable: false
  srtp_mandatory: false
  bundle_enable: false
  # Additional optional SIP listeners; leave empty to disable protocols.
  # sip_tls_listen_addr: ""             # e.g. "0.0.0.0:5071"; requires certificate + key
  # sip_dtls_listen_addr: ""            # e.g. "0.0.0.0:5072"; requires certificate + key
  # sip_ws_listen_addr: ""              # e.g. "0.0.0.0:5080"
  # sip_wss_listen_addr: ""             # e.g. "0.0.0.0:5081"; requires certificate + key
  # sip_tls_cert_file: ""               # TLS PEM certificate path
  # sip_tls_key_file: ""                # Private key PEM path; never commit actual keys

# Optional metrics Basic authentication. Empty config leaves /metrics public.
# metrics_auth:
#   username: ""                        # Set username and exactly one credential field
#   password_hash: ""                   # Prefer a supported password hash over plaintext
