        name: { type: string }
        enabled: { type: boolean }
        camera_id:
          type: string
          description: 空 = 任意摄像头 / Empty = any camera
        source:
          type: string
          description: 空 = 任意来源 / Empty = any source
        event_type:
          type: string
          description: 空 = 任意类型 / Empty = any type
        severity:
          type: string
          description: 空 = 任意级别 / Empty = any severity
        action:
          type: string
          enum: [record, webhook, goto_preset]
        action_target:
          type: string
          description: Webhook URL 或 ONVIF 预置位 token。`record` 不用 / Webhook URL or ONVIF preset token. Unused for `record`
        created_at: { type: string, format: date-time }
